<!DOCTYPE html>
<html lang="{{LANG}}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}" />

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/elements/favicon.ico" />

    <!-- Bootstrap Icons — used by the feature/testimonial/contact icons below -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS framework — WebHaste doesn't inject this automatically; add
         your own tags here, or reference a local copy from scripts/. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- template-specific css -->
    <link href="/scripts/styles.css" rel="stylesheet" type="text/css" />

    <!-- template-specific js — deferred so #contactForm exists in the DOM by
         the time scripts.js runs; without it this <script> (in <head>, no
         defer) executes before <body> is parsed and getElementById('contactForm')
         returns null -->
    <script src="/scripts/scripts.js" defer></script>

    <!-- site search — see README's "Site search" section -->
    <script src="/scripts/lunr.min.js"></script>
    <script src="/scripts/search.js"></script>

    <!-- lists (List: Links / List: Directory / List: Table blocks) — see CLAUDE.md's "Lists" section -->
    <script src="/scripts/list.js"></script>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container px-5">
            <a class="navbar-brand" href="/index.html">{{SITE_NAME}}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                {{NAV:header}}
                <div class="position-relative ms-lg-auto" style="min-width:240px;">
                    <input class="form-control" type="search" id="cs-search-input" placeholder="Search..." autocomplete="off">
                    <div id="cs-search-results" class="position-absolute end-0 bg-white border rounded shadow-sm mt-1" style="z-index:1050;"></div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        {{CONTENT}}
    </main>

    <footer class="py-5 bg-dark">
        <div class="container px-5">
            <p class="m-0 text-center text-white">&copy; {{YEAR}} {{SITE_NAME}}</p>
        </div>
    </footer>

</body>

</html>
